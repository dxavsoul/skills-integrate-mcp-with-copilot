<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="user-menu-container">
      <button id="user-menu-button" aria-label="User menu" title="Teacher login">
        👤
      </button>
      <div id="user-menu" class="hidden">
        <div id="auth-logged-out">
          <button id="show-login-button" type="button">Login</button>
        </div>
        <form id="login-form" class="hidden">
          <label for="teacher-username">Username</label>
          <input id="teacher-username" type="text" required />
          <label for="teacher-password">Password</label>
          <input id="teacher-password" type="password" required />
          <button type="submit">Sign In</button>
        </form>
        <div id="auth-logged-in" class="hidden">
          <p id="teacher-name"></p>
          <button id="logout-button" type="button">Logout</button>
        </div>
      </div>
    </div>

    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="teacher-only-note" class="info-note">
          Teacher login required to register or unregister students.
        </p>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
